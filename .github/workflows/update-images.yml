name: Update Card Database

on:
  workflow_dispatch:

concurrency:
  group: update-card-database
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.41.0 beautifulsoup4==4.14.3 requests==2.33.0

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "VITE_SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "${VITE_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "VITE_SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi

          echo "Required secrets are available"

      - name: Run card database scraper
        run: |
          echo "Running official card database scraper..."
          python scripts/scraper.py

      - name: Validate generated dataset
        run: |
          node -e "const cards=require('./src/data/cards.json'); if(cards.length < 100) throw new Error('Dataset below safety threshold: ' + cards.length); const ids=cards.map(c=>c.id); const duplicates=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))]; if(duplicates.length) throw new Error('Duplicate IDs: ' + duplicates.join(', ')); console.log('Validated cards:', cards.length); console.log('Types:', cards.reduce((a,c)=>(a[c.type]=(a[c.type]||0)+1,a),{}));"

      - name: Run image health check
        run: |
          echo "Checking synchronized image health..."
          node scripts/checkImageHealth.js
        continue-on-error: true

      - name: Backup card images to Supabase
        run: |
          echo "Backing up card images..."
          node scripts/backupImages.js

      - name: Remove temporary scraper files
        shell: bash
        run: |
          rm -f src/data/cards.pre-scrape.json
          rm -f src/data/cards.backup.json
          rm -f src/data/cards.tmp.json

      - name: Build application
        run: npm run build

      - name: Commit and push synchronized data
        shell: bash
        run: |
          git config user.email "action@github.com"
          git config user.name "Afterlife Decks Bot"

          git add src/data/cards.json
          git add broken-images-report.json || true

          if git diff --staged --quiet; then
            echo "No card database changes detected"
            exit 0
          fi

          git commit -m "chore: synchronize official card database [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

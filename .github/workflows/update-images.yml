name: Update Card Images

on:
  workflow_dispatch:

jobs:
  update-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install selenium beautifulsoup4 requests
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run image health check
        run: |
          echo "Checking image health..."
          node scripts/checkImageHealth.js

      - name: Run card database scraper
        run: |
          echo "Running card scraper..."
          python scripts/scraper.py

      - name: Backup card images
        run: |
          echo "Backing up images..."
          node scripts/backupImages.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Afterlife Decks Bot"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "chore: auto-update card database [skip ci]"

          git pull --rebase origin main
          git push origin main

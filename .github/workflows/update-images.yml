name: Update Card Images

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-images:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      # SCRIPT 1: Check image health (Node.js)
      - name: Run image health check
        run: |
          echo "🔍 Checking image health..."
          node scripts/checkImageHealth.js
        continue-on-error: true
      
      # SCRIPT 2: Run scraper (Python)
      - name: Run card image scraper
        run: |
          echo "🕷️ Running image scraper..."
          python scripts/scraper.py
        continue-on-error: true
      
      # SCRIPT 3: Backup images (Node.js)
      - name: Backup card images
        run: |
          echo "💾 Backing up images..."
          node scripts/backupImages.js
        continue-on-error: true
      
      # Commit all changes
      - name: Commit updated images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Afterlife Decks Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore: auto-update card images [skip ci]
            
            - Health check: $(date)
            - Scraper: Updated image sources
            - Backup: All images backed up
            
            Automated by GitHub Actions"
          fi
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

name: Update Card Images

on:
  schedule:
    # Runs at 3 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger button

jobs:
  update-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run image health check
        run: node scripts/checkImageHealth.js
      
      - name: Commit updated images (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-update card images [skip ci]"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

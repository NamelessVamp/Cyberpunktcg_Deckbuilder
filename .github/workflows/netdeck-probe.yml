name: Probe NetDeck API

on:
  workflow_dispatch:

  push:
    branches:
      - feature/netdeck-migration

jobs:
  probe-netdeck:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install requests==2.33.0

      - name: Run probe
        run: |
          python scripts/netdeck_probe.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netdeck-probe-report
          path: artifacts/netdeck/
          if-no-files-found: warn

name: Build NetDeck Candidate

on:
  workflow_dispatch:

  push:
    branches:
      - feature/netdeck-migration
    paths:
      - "scripts/netdeck_ingest.py"
      - ".github/workflows/netdeck-ingest.yml"

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install requests==2.33.0

      - name: Build candidate dataset
        run: |
          python scripts/netdeck_ingest.py

      - name: Validate candidate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/data/cards.candidate.json")
          cards = json.loads(path.read_text(encoding="utf-8"))

          print(f"Candidate cards: {len(cards)}")
          print(
              "Printings:",
              sum(len(card["printings"]) for card in cards),
          )

          if len(cards) < 120:
              raise SystemExit("Candidate dataset is unexpectedly small.")
          PY

      - name: Upload NetDeck snapshots
        uses: actions/upload-artifact@v4
        with:
          name: netdeck-candidate
          path: |
            src/data/cards.netdeck.raw.json
            src/data/cards.candidate.json
          if-no-files-found: error
          retention-days: 7

# Candidate workflow trigger
